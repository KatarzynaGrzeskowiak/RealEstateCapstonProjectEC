<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/home_icon.png">
  <link rel="stylesheet" href="../../styles/main.css">
  <title>Gallery</title>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo-container">
        <a href="index.html" class="logo">
          <img class="logo_img" src="../../assets/icons/home_icon.png" alt="home icon">
          <h1>EstateFinder</h1>
        </a>
        <button class="mobile-menu-btn">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
        </button>
      </div>
      <div class="bottom-nav">
        <nav>
          <ul class="nav-menu">
            <li class="nav-item">
              <a href="../Home/index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link current-page">Gallery</a>
            </li>
            <li class="nav-item">
              <a href="../Contacts/index.html" class="nav-link">Contacts</a>
              <div class="submenu">
                <ul class="submenu-list">
                  <li class="submenu-item">
                    <a href="../Contacts/index.html#form" class="submenu-link">Contact Form</a>
                  </li>
                  <li class="submenu-item">
                    <a href="../Contacts/index.html#map" class="submenu-link">Location</a>
                  </li>
                  <li class="submenu-item">
                    <a href="../Contacts/index.html#social" class="submenu-link">Social Media</a>
                  </li>
                </ul>
              </div>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main>
    <div id="gallery-container">
      <h2>Our Apartments</h2>
      <div class="gallery-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search apartments...">
        </div>
        <div class="filter-sort-container">
          <div class="filter-box">
            <select id="price-filter">
              <option value="">Price Range</option>
              <option value="0-500000">Up to 500 000 PLN</option>
              <option value="500000-800000">500 000 - 800 000 PLN</option>
              <option value="800000-1200000">800 000 - 1 200 000 PLN</option>
              <option value="1200000+">Above 1 200 000 PLN</option>
            </select>
            <select id="rooms-filter">
              <option value="">Rooms</option>
              <option value="1">1 Room</option>
              <option value="2">2 Rooms</option>
              <option value="3">3 Rooms</option>
              <option value="4">4 Rooms</option>
              <option value="5">5 Rooms</option>
            </select>
          </div>
          <div class="sort-box">
            <select id="sort-by">
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rooms-asc">Rooms: Low to High</option>
              <option value="rooms-desc">Rooms: High to Low</option>
            </select>
          </div>
        </div>
      </div>
      <div class="gallery-grid">
        <div class="gallery-items"></div>
        <div class="no-results-message">
          <p>No apartments found matching your criteria.</p>
          <p>Try adjusting your filters or search term.</p>
        </div>
        <button class="show-more-btn">Show More</button>
      </div>
      <div class="pagination">
        <button class="pagination-btn prev" disabled>&lt; Previous</button>
        <div class="page-numbers"></div>
        <button class="pagination-btn next">Next &gt;</button>
      </div>
    </div>
  </main>
  <footer>
    <div class="socials-container">
      <div class="socials">
        <div class="socials-item-container">
          <a class="socials-icon" href="https://web.telegram.org/" target="_blank"><img src="../../assets/icons/telegram.png" alt="Telegram icon" ></a>
        </div>
        <div class="socials-item-container">
          <a class="socials-icon" href="https://www.facebook.com/" target="_blank"><img src="../../assets/icons/facebook.png" alt="Facebook icon" ></a>
        </div>
        <div class="socials-item-container">
          <a class="socials-icon" href="https://www.instagram.com/" target="_blank"><img src="../../assets/icons/instagram.png" alt="Instagram icon" ></a>
        </div>
        <div class="socials-item-container">
          <a class="socials-icon" href="https://www.x.com/" target="_blank"><img src="../../assets/icons/X.png" alt="x icon" ></a>
        </div>
      </div>
      <p>© Copyright 2025, All Rights Reserved</p>
      <a class="made-text" href="https://github.com/KatarzynaGrzeskowiak" target="_blank">Made by Katarzyna Grześkowiak</a>
    </div>
  </footer>
  <script src="gallery.js" type="module"></script>
</body>
</html>
